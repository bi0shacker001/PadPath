name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish portable app
        shell: pwsh
        run: .\scripts\publish.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HandheldLauncher-windows-x64
          path: |
            outputs/HandheldLauncher-Setup-*.exe
            dist/*
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: outputs/HandheldLauncher-Setup-*.exe
