name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    strategy:
      matrix:
        runtime: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: pwsh
        run: .\scripts\publish.ps1 -Runtime ${{ matrix.runtime }} -Output dist\PadPath-${{ matrix.runtime }}
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist\PadPath-${{ matrix.runtime }}\* -DestinationPath PadPath-${{ matrix.runtime }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: PadPath-${{ matrix.runtime }}
          path: PadPath-${{ matrix.runtime }}.zip
      - name: Attach portable build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: PadPath-${{ matrix.runtime }}.zip

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: PadPath-windows-installer
          path: outputs/PadPath-Setup-*.exe
      - name: Attach installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: outputs/PadPath-Setup-*.exe
