name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore PadPath.sln
      - name: Verify formatting
        run: dotnet format PadPath.sln --no-restore --verify-no-changes
      - name: Build
        run: dotnet build PadPath.sln -c Release --no-restore
      - name: Publish smoke test
        run: dotnet publish src/PadPath/PadPath.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -o dist/${{ matrix.runtime }}
      - uses: actions/upload-artifact@v7
        with:
          name: PadPath-${{ matrix.runtime }}
          path: dist/${{ matrix.runtime }}/
          if-no-files-found: error
